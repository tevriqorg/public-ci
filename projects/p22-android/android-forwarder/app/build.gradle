apply plugin: 'com.android.application'

android {
    namespace 'tech.bogomolov.incomingsmsgateway'
    compileSdkVersion 33

    defaultConfig {
        applicationId "tech.bogomolov.incomingsmsgateway"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 20
        versionName "2.7.0-beta2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Render the action-bar vector icons (e.g. the Settings gear) via the
        // support library so they work back to minSdkVersion 26.
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Isolated preview does NOT use the production vivo signing key.
        // Separate Android package avoids overwriting an already-paired device.
        // Use build-system-generated per-run test signature, never a private key.
        preview {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            debuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Let unmocked android.* calls (e.g. Log.e in error paths) return defaults
        // instead of throwing, so logic touching them stays JVM-unit-testable.
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    def work_version = "2.7.1"

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment:2.0.0'
    implementation 'androidx.navigation:navigation-ui:2.0.0'
    implementation "androidx.work:work-runtime:$work_version"
    implementation 'org.apache.commons:commons-text:1.9'
    // Self-contained QR reader; no Google Play Services dependency.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Optional Shizuku status and user-initiated permission, no shell execution.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation('com.google.crypto.tink:tink-android:1.23.0') {
        exclude group: 'androidx.annotation', module: 'annotation-jvm'
    }

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:3.7.0'
    testImplementation 'org.json:json:20240303'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "org.mockito:mockito-android:3.7.0"
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation "androidx.work:work-testing:$work_version"
}
