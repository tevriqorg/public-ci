name: P14 Inbox UI on Android emulator (synthetic, isolated)

on:
  workflow_dispatch:
    inputs:
      live_hermes:
        description: Opt-in isolated real Hermes acceptance (temporary private test credentials required)
        required: false
        type: boolean
        default: false
      source_sha:
        description: Exact public RikkaHub Inbox branch SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  inbox-android-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate exact source
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout public Android source (not production Server)
        uses: actions/checkout@v4
        with:
          repository: tevriqorg/rikkahub
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          submodules: recursive
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: JDK 21 (preinstalled Temurin, avoid JetBrains remote rate limit)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false
          cache: gradle
      - name: pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - name: Test-only Google Services configuration
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "rikkahub-p14-ci",
              "storage_bucket": "rikkahub-p14-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                "android_client_info": {"package_name": "me.rerere.rikkahub.debug"}
              },
              "api_key": [{"current_key": "AIzaSyCIOnlyPlaceholderNotARealKey000000"}]
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Set CI version metadata to actual source
        run: echo "P14_BUILD_SUFFIX=p14-${SOURCE_SHA:0:8}" >> "$GITHUB_ENV"
      - name: Prepare loopback-only synthetic connectivity probe and UID isolation script
        run: |
          mkdir -p /tmp/p14-network-probe
          printf '%s\n' '{"p14-server":"synthetic connectivity probe only"}' > /tmp/p14-network-probe/healthz
          python3 -m http.server 8014 --bind 127.0.0.1 --directory /tmp/p14-network-probe > /tmp/p14-network-probe.log 2>&1 &
          cat > /tmp/p14-uid-isolation.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p app/build/p14-evidence
          probe() {
            adb shell am instrument -w -r -e class "me.rerere.rikkahub.data.remote.p14.P14RecoveryInstrumentedTest#$1" -e p14BaseUrl http://10.0.2.2:8014/v1 me.rerere.rikkahub.debug.test/androidx.test.runner.AndroidJUnitRunner | tee "app/build/p14-evidence/$1.txt"
            grep -q 'OK (' "app/build/p14-evidence/$1.txt"
            ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED' "app/build/p14-evidence/$1.txt"
          }
          curl --retry 5 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8014/healthz > app/build/p14-evidence/probe-alive-before.txt
          probe networkOnline
          adb root
          adb wait-for-device
          APP_UID="$(adb shell stat -c %u /data/user/0/me.rerere.rikkahub.debug | tr -d '\r')"
          [[ "$APP_UID" =~ ^[0-9]+$ ]]
          trap 'adb shell iptables -D OUTPUT -m owner --uid-owner "$APP_UID" -j REJECT >/dev/null 2>&1 || true; adb shell ip6tables -D OUTPUT -m owner --uid-owner "$APP_UID" -j REJECT >/dev/null 2>&1 || true' EXIT
          adb shell iptables -I OUTPUT -m owner --uid-owner "$APP_UID" -j REJECT
          adb shell ip6tables -I OUTPUT -m owner --uid-owner "$APP_UID" -j REJECT
          adb shell iptables -L OUTPUT -n -v > app/build/p14-evidence/uid-ipv4-block.txt
          adb shell ip6tables -L OUTPUT -n -v > app/build/p14-evidence/uid-ipv6-block.txt
          probe networkOffline
          curl -fsS http://127.0.0.1:8014/healthz > app/build/p14-evidence/probe-alive-after.txt
          bash scripts/p14_inbox_emulator_evidence.sh
          SH
      - name: Prepare real keyboard and revision regression tests
        run: |
          cat > /tmp/p14-high-fidelity-tests.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p app/build/p14-evidence
          trap 'adb pull /sdcard/Android/data/me.rerere.rikkahub.debug/files/ci-additional app/build/p14-evidence/visual-output || true' EXIT
          adb shell wm size 1080x2400
          adb shell wm density 440
          adb shell settings put system font_scale 1.0
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb shell cmd uimode night no
          adb shell ime list -s > app/build/p14-evidence/ime.txt
          run_test() {
            local name="$1" klass="$2" count="$3"
            adb shell am instrument -w -r -e p14SyntheticFixture true -e additionalTestOutputDir /sdcard/Android/data/me.rerere.rikkahub.debug/files/ci-additional -e class "$klass" me.rerere.rikkahub.debug.test/androidx.test.runner.AndroidJUnitRunner | tee "app/build/p14-evidence/$name.txt"
            grep -Fq "OK ($count)" "app/build/p14-evidence/$name.txt"
            ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED' "app/build/p14-evidence/$name.txt"
          }
          run_test revisions me.rerere.rikkahub.data.remote.p14.P14EntryRevisionInstrumentedTest '9 tests'
          run_test visual me.rerere.rikkahub.ui.activity.P14HighFidelityVisualInstrumentedTest#visualJourney '1 test'
          run_test native-chat me.rerere.rikkahub.ui.activity.P14HighFidelityVisualInstrumentedTest#nativeChatExchange '1 test'
          run_test attachments me.rerere.rikkahub.ui.activity.P14HighFidelityVisualInstrumentedTest#attachmentHandoff '1 test'
          run_test seed-editor-recovery me.rerere.rikkahub.ui.activity.P14HighFidelityVisualInstrumentedTest#seedEditRecovery '1 test'
          adb shell am force-stop me.rerere.rikkahub.debug
          run_test verify-editor-recovery me.rerere.rikkahub.ui.activity.P14HighFidelityVisualInstrumentedTest#verifyEditRecovery '1 test'
          SH
      - name: Enable and require hardware-accelerated isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Connect disposable private acceptance node
        if: inputs.live_hermes
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          authkey: ${{ secrets.P14_LIVE_TS_AUTHKEY }}
          hostname: p14-live-ci-${{ github.run_id }}
          args: --accept-dns=false
          log-mode: quiet
      - name: Bridge isolated test Server to emulator host alias
        if: inputs.live_hermes
        run: |
          curl --connect-timeout 15 --max-time 30 -fsS http://100.84.55.11:18144/healthz
          python3 scripts/p14_live_test_proxy.py > /tmp/p14-live-proxy.log 2>&1 &
      - name: Prepare flavor-aware emulator install script
        run: |
          cat > /tmp/p14-variant-build-install.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if grep -q 'create("github")' app/build.gradle.kts; then
            connected_task=:app:connectedGithubDebugAndroidTest
          else
            connected_task=:app:connectedDebugAndroidTest
          fi
          ./gradlew "$connected_task" -Pandroid.testInstrumentationRunnerArguments.class=me.rerere.rikkahub.ui.activity.P14InboxReplicaUiInstrumentedTest --stacktrace
          mapfile -t app_apks < <(find app/build/outputs/apk -type f -name '*x86_64*debug.apk' | sort)
          mapfile -t test_apks < <(find app/build/outputs/apk -type f -name '*androidTest.apk' | sort)
          test "${#app_apks[@]}" -eq 1
          test "${#test_apks[@]}" -eq 1
          adb install -r "${app_apks[0]}"
          adb install -r "${test_apks[0]}"
          SH
          chmod +x /tmp/p14-variant-build-install.sh
          bash -n /tmp/p14-variant-build-install.sh
      - name: Run Inbox UI on clean Android emulator, synthetic Entry only
        env:
          P14_LIVE_ENABLED: ${{ inputs.live_hermes }}
          P14_LIVE_TEST_TOKEN: ${{ secrets.P14_LIVE_TEST_TOKEN }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 300
          force-avd-creation: true
          script: |
            mkdir -p app/build/p14-evidence
            adb shell dumpsys activity lastanr > app/build/p14-evidence/emulator-last-anr-before.txt
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher > app/build/p14-evidence/isolated-launcher-disabled.txt
            chmod +x gradlew
            bash /tmp/p14-variant-build-install.sh
            adb shell pm grant me.rerere.rikkahub.debug android.permission.POST_NOTIFICATIONS
            mkdir -p app/build/p14-evidence
            adb shell am instrument -w -r -e class me.rerere.rikkahub.ui.activity.P14InboxLauncherInstrumentedTest me.rerere.rikkahub.debug.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/p14-evidence/launcher.txt
            grep -q 'OK (1 test)' app/build/p14-evidence/launcher.txt
            ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED' app/build/p14-evidence/launcher.txt
            bash /tmp/p14-high-fidelity-tests.sh
            bash /tmp/p14-uid-isolation.sh
            if [ "$P14_LIVE_ENABLED" = "true" ]; then adb shell am instrument -w -r -e p14LiveHermes true -e p14SyntheticFixture true -e p14BaseUrl http://10.0.2.2:18144/v1 -e p14TestToken "$P14_LIVE_TEST_TOKEN" -e class me.rerere.rikkahub.ui.activity.P14LiveHermesInstrumentedTest me.rerere.rikkahub.debug.test/androidx.test.runner.AndroidJUnitRunner > app/build/p14-evidence/live-hermes.txt; cat app/build/p14-evidence/live-hermes.txt; adb pull /sdcard/Android/data/me.rerere.rikkahub.debug/files/ci-additional/p14-live-hermes app/build/p14-evidence/live-hermes; grep -Fq 'OK (1 test)' app/build/p14-evidence/live-hermes.txt; ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED' app/build/p14-evidence/live-hermes.txt; fi
      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p14-inbox-ui-test-report-${{ env.SOURCE_SHA }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            app/build/p14-evidence/
          if-no-files-found: ignore
          retention-days: 7
