name: P22 Android snapshot fixed-signing candidate (P20 only)
on:
  pull_request:
    paths:
      - 'projects/p22-android/**'
      - '.github/workflows/p22-vivo-fixed-signing.yml'
  workflow_dispatch:
    inputs:
      fixed_sign:
        description: Sign with existing vivo identity after environment reviewer approval
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: p22-vivo-${{ github.sha }}
  cancel-in-progress: false
jobs:
  snapshot-pr-check:
    if: github.event_name == 'pull_request' && github.repository == 'tevriqorg/public-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 33
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk --install 'platforms;android-33' 'build-tools;33.0.2'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test public-safe Android snapshot without secrets
        working-directory: projects/p22-android/android-forwarder
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify unsigned release package identity (do not upload)
        run: |
          set -euo pipefail
          APK=projects/p22-android/android-forwarder/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          /usr/local/lib/android/sdk/build-tools/33.0.2/aapt dump badging "$APK" | grep -F "name='tech.bogomolov.incomingsmsgateway'"
          echo 'Public snapshot build and test PASS; no release artifact or secret used'
  build-and-sign:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'tevriqorg/public-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: p22-vivo-fixed-signing
    steps:
      - name: Checkout approved public-ci snapshot, never private repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pinned source snapshot
        id: source
        run: |
          set -euo pipefail
          SHA="$(cat projects/p22-android/SOURCE_REVISION)"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -f projects/p22-android/android-forwarder/LICENSE.txt
          test -f projects/p22-android/android-forwarder/app/build.gradle
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Restore build-only relay hostname from protected environment
        env:
          P22_RELAY_HOST: ${{ secrets.P22_RELAY_HOST }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          host = os.environ.get("P22_RELAY_HOST", "").strip()
          if not re.fullmatch(r"[A-Za-z0-9.-]+\.[A-Za-z]{2,}", host) or ".invalid" in host:
              raise SystemExit("P22 relay endpoint configuration missing or invalid")
          root=pathlib.Path("projects/p22-android/android-forwarder/app/src")
          count=0
          for p in root.rglob("*.java"):
              src=p.read_text()
              if "relay.p22.example.invalid" not in src:
                  continue
              count+=src.count("relay.p22.example.invalid")
              p.write_text(src.replace("relay.p22.example.invalid",host))
          if count<3:
              raise SystemExit("Missing expected sanitized relay endpoint placeholders")
          print("Protected P22 relay hostname restored (value suppressed)")
          PY
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 33 tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk --install 'platforms;android-33' 'build-tools;33.0.2'
          echo "/usr/local/lib/android/sdk/build-tools/33.0.2" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM unit tests and UNSIGNED Release build
        working-directory: projects/p22-android/android-forwarder
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify Android package identity and provenance
        run: |
          set -euo pipefail
          APK=projects/p22-android/android-forwarder/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/p22-unsigned"
          python3 - "$APK" "$SOURCE_SHA" "$RUNNER_TEMP/p22-unsigned" <<'PY'
          import hashlib,json,pathlib,re,subprocess,sys
          apk,sha,folder=sys.argv[1:]
          badging=subprocess.run(["aapt","dump","badging",apk],check=True,capture_output=True,text=True).stdout
          m=re.search(r"^package: name='([^']+)' versionCode='(\d+)'",badging,re.M)
          assert m and m.group(1)=="tech.bogomolov.incomingsmsgateway","unexpected package"
          assert int(m.group(2))>=18,"version below installed baseline"
          assert "application-debuggable" not in badging,"release must not be debuggable"
          d=pathlib.Path(folder)
          d.joinpath("SOURCE_SHA").write_text(sha+"\n")
          d.joinpath("UNSIGNED_SHA256").write_text(hashlib.sha256(pathlib.Path(apk).read_bytes()).hexdigest()+"\n")
          d.joinpath("candidate.json").write_text(json.dumps({
             "source_repository":"tevriqorg/P22-Personal-Relay",
             "source_sha":sha,"package":m.group(1),
             "version_code":int(m.group(2)),
             "status":"UNSIGNED_ONLY","not_installable":True
          },indent=2)+"\n")
          print("P22 unsigned package/version/source gate PASS")
          PY
          cp "$APK" "$RUNNER_TEMP/p22-unsigned/app-release-unsigned.apk"
      - name: Upload unsigned diagnostic artifact (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: p22-vivo-UNSIGNED-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/p22-unsigned/
          if-no-files-found: error
          retention-days: 1
      - name: Fixed-sign with the EXISTING protected vivo identity
        if: inputs.fixed_sign == true
        env:
          P22_P12_B64: ${{ secrets.P22_VIVO_KEYSTORE_P12_B64 }}
          P22_PASSWORD_B64: ${{ secrets.P22_VIVO_KEYSTORE_PASSWORD_B64 }}
        run: |
          set -euo pipefail
          test -n "$P22_P12_B64" && test -n "$P22_PASSWORD_B64" || {
            echo "::error::Existing vivo identity missing. No fallback signing allowed."
            exit 1
          }
          umask 077
          mkdir -p "$RUNNER_TEMP/p22-secret" "$RUNNER_TEMP/p22-signed"
          trap 'rm -f "$RUNNER_TEMP/p22-secret/vivo-test-keystore.p12" "$RUNNER_TEMP/p22-secret/keystore.password"' EXIT
          printf '%s' "$P22_P12_B64" | base64 --decode > "$RUNNER_TEMP/p22-secret/vivo-test-keystore.p12"
          printf '%s' "$P22_PASSWORD_B64" | base64 --decode > "$RUNNER_TEMP/p22-secret/keystore.password"
          chmod 600 "$RUNNER_TEMP/p22-secret/"*
          python3 scripts/p22_vivo_fixed_sign.py \
            --input "$RUNNER_TEMP/p22-unsigned/app-release-unsigned.apk" \
            --output "$RUNNER_TEMP/p22-signed/P22-vivo-fixed-${SOURCE_SHA:0:8}.apk" \
            --source-sha "$SOURCE_SHA" \
            --signing-dir "$RUNNER_TEMP/p22-secret" \
            --candidate-manifest "$RUNNER_TEMP/p22-unsigned/candidate.json"
      - name: Remove ephemeral signing material even on failure
        if: always()
        run: rm -f "$RUNNER_TEMP/p22-secret/vivo-test-keystore.p12" "$RUNNER_TEMP/p22-secret/keystore.password"
      - name: Upload verified fixed-signed P20 handoff artifact, not GitHub Release
        if: inputs.fixed_sign == true
        uses: actions/upload-artifact@v4
        with:
          name: p22-vivo-FIXED-SIGNED-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/p22-signed/
          if-no-files-found: error
          retention-days: 1
