name: P2 126 derived identity regression
on:
  pull_request:
    paths: ['.github/workflows/p2-126-derived.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  derived-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          repository: tevriqorg/WeKnora
          ref: 1b08d6c4c2c6ad8ceb664b2616beef8ad1b50dfe
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Source identity and revision regression
        run: go test ./internal/application/service -run 'TestDerived' -count=1 -timeout=120s -v
      - name: Full affected-domain regression
        run: |
          test -z "$(gofmt -l internal/types/derived_knowledge*.go internal/application/service/derived_knowledge*.go internal/application/service/manual_source_revision.go)"
          go test ./internal/types ./internal/application/service ./internal/application/repository ./internal/handler ./internal/router -count=1 -timeout=5m
      - name: Build exact server artifact
        run: |
          mkdir -p dist
          go build -o dist/weknora-server ./cmd/server
          git rev-parse HEAD > dist/SOURCE_REVISION
          cd dist
          sha256sum weknora-server SOURCE_REVISION > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: p2-126-weknora-server
          path: dist/
          retention-days: 14
