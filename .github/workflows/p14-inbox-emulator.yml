name: P14 Inbox UI on Android emulator (synthetic, isolated)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact public RikkaHub Inbox branch SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  inbox-android-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate exact source
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout public Android source (not production Server)
        uses: actions/checkout@v4
        with:
          repository: tevriqorg/rikkahub
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          submodules: recursive
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
          cache: gradle
      - name: pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - name: Test-only Google Services configuration
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "rikkahub-p14-ci",
              "storage_bucket": "rikkahub-p14-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                "android_client_info": {"package_name": "me.rerere.rikkahub.debug"}
              },
              "api_key": [{"current_key": "AIzaSyCIOnlyPlaceholderNotARealKey000000"}]
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Set CI version metadata to actual source
        run: echo "P14_BUILD_SUFFIX=p14-${SOURCE_SHA:0:8}" >> "$GITHUB_ENV"
      - name: Prepare loopback-only synthetic connectivity probe and UID isolation script
        run: |
          mkdir -p /tmp/p14-network-probe
          printf '%s\n' '{"p14-server":"synthetic connectivity probe only"}' > /tmp/p14-network-probe/healthz
          python3 -m http.server 8014 --bind 127.0.0.1 --directory /tmp/p14-network-probe > /tmp/p14-network-probe.log 2>&1 &
          cat > /tmp/p14-uid-isolation.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p app/build/p14-evidence
          probe() {
            adb shell am instrument -w -r -e class "me.rerere.rikkahub.data.remote.p14.P14RecoveryInstrumentedTest#$1" -e p14BaseUrl http://10.0.2.2:8014/v1 me.rerere.rikkahub.debug.test/androidx.test.runner.AndroidJUnitRunner | tee "app/build/p14-evidence/$1.txt"
            grep -q 'OK (' "app/build/p14-evidence/$1.txt"
            ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED' "app/build/p14-evidence/$1.txt"
          }
          curl --retry 5 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8014/healthz > app/build/p14-evidence/probe-alive-before.txt
          probe networkOnline
          adb root
          adb wait-for-device
          APP_UID="$(adb shell stat -c %u /data/user/0/me.rerere.rikkahub.debug | tr -d '\r')"
          [[ "$APP_UID" =~ ^[0-9]+$ ]]
          trap 'adb shell iptables -D OUTPUT -m owner --uid-owner "$APP_UID" -j REJECT >/dev/null 2>&1 || true; adb shell ip6tables -D OUTPUT -m owner --uid-owner "$APP_UID" -j REJECT >/dev/null 2>&1 || true' EXIT
          adb shell iptables -I OUTPUT -m owner --uid-owner "$APP_UID" -j REJECT
          adb shell ip6tables -I OUTPUT -m owner --uid-owner "$APP_UID" -j REJECT
          adb shell iptables -L OUTPUT -n -v > app/build/p14-evidence/uid-ipv4-block.txt
          adb shell ip6tables -L OUTPUT -n -v > app/build/p14-evidence/uid-ipv6-block.txt
          probe networkOffline
          curl -fsS http://127.0.0.1:8014/healthz > app/build/p14-evidence/probe-alive-after.txt
          bash scripts/p14_inbox_emulator_evidence.sh
          SH
      - name: Enable and require hardware-accelerated isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run Inbox UI on clean Android emulator, synthetic Entry only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 300
          force-avd-creation: true
          script: |
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=me.rerere.rikkahub.ui.activity.P14InboxReplicaUiInstrumentedTest,me.rerere.rikkahub.ui.activity.P14InboxLauncherInstrumentedTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant me.rerere.rikkahub.debug android.permission.POST_NOTIFICATIONS
            bash /tmp/p14-uid-isolation.sh
      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p14-inbox-ui-test-report-${{ env.SOURCE_SHA }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            app/build/p14-evidence/
          if-no-files-found: ignore
          retention-days: 7
