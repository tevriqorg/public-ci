name: Private project source CI

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project source snapshot to test
        required: true
        type: choice
        options:
          - p16-home-vision

permissions:
  contents: read

concurrency:
  group: public-ci-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  p16-ci:
    if: github.ref == 'refs/heads/main' && inputs.project == 'p16-home-vision'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/p16-home-vision/implementation/pyproject.toml

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install backend dependencies
        working-directory: projects/p16-home-vision/implementation
        run: python -m pip install -e '.[dev]'

      - name: Run backend regression suite
        working-directory: projects/p16-home-vision/implementation
        run: |
          pytest tests --ignore=tests/test_ui_w7.py
          pytest tests/test_ui_w7.py -k "not test_runtime_refreshes_task_badge_catalog_and_live_progress_without_losing_context and not test_runtime_preserves_progressive_archive_and_player_navigation"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: projects/p16-home-vision/implementation/frontend-r2
        run: npm install --no-audit --no-fund

      - name: Run frontend tests and build
        working-directory: projects/p16-home-vision/implementation/frontend-r2
        run: |
          npm test
          npm run build

      - name: Run four-viewport browser acceptance
        working-directory: projects/p16-home-vision/implementation/frontend-r2
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.config.js
