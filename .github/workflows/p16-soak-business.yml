name: P16 synthetic business fault regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  business:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
        working-directory: projects/p16-home-vision/implementation
      - run: pytest tests/test_scan_nvr.py tests/test_nvr.py tests/test_auto_archive.py -q
        working-directory: projects/p16-home-vision/implementation
