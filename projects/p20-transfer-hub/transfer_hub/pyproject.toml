[project]
name = "p20-transfer-hub"
version = "0.5.15"
description = "Tokyo Transfer Hub backend for P20"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "cryptography>=44,<51",
]

[project.scripts]
p20-receive = "p20_receive:main"
p20-cmcloud-e2ee = "p20_cmcloud_e2ee:main"
p20-watchd = "transfer_hub.watchd:main"

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]
test = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["p20_receive", "p20_cmcloud_e2ee"]

[tool.setuptools.packages.find]
include = ["transfer_hub*"]
exclude = ["web*", "qqxfer_adapter*", "tests*"]
