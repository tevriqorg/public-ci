[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "home-vision"
version = "0.2.0.dev1"
description = "Home Vision archive and media derivation service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "sqlalchemy>=2.0.43,<3",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
p16-media-derive = "media_derivation.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["app", "analysis_worker", "media_derivation"]
