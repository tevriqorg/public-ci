name: P14 private Server verified image (ephemeral source access)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: p14-server-verified-image
  cancel-in-progress: false
jobs:
  server:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: p14
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: p14_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U p14 -d p14_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      P14_TEST_DATABASE_URL: postgresql+psycopg://p14:synthetic-ci-only@127.0.0.1:5432/p14_test
    steps:
      - name: Fetch exact private source using short-lived GitHub archive capability
        env:
          ARCHIVE_URL: ${{ secrets.P14_EPHEMERAL_SOURCE_ARCHIVE_URL }}
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,re,tarfile,urllib.parse,urllib.request
          sha=os.environ['SOURCE_SHA']; expected=os.environ['ARCHIVE_SHA256']; url=os.environ['ARCHIVE_URL']
          assert re.fullmatch('[0-9a-f]{40}',sha) and re.fullmatch('[0-9a-f]{64}',expected)
          u=urllib.parse.urlparse(url)
          assert u.hostname=='codeload.github.com' and sha in u.path and urllib.parse.parse_qs(u.query).get('token')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'p14-private-source';target.mkdir(mode=0o700)
          try:
              raw=urllib.request.urlopen(url,timeout=120).read()
          except Exception:
              raise SystemExit('Private archive fetch failed; refresh short-lived capability. URL omitted.')
          assert hashlib.sha256(raw).hexdigest()==expected,'Source archive digest mismatch'
          archive=target.parent/'p14-private-source.tar.gz';archive.write_bytes(raw)
          with tarfile.open(archive) as t:
              roots={m.name.split('/')[0] for m in t.getmembers()};assert len(roots)==1
              root=roots.pop();assert root.endswith(sha[:7])
              selected=[]
              for m in t.getmembers():
                  rel=m.name.partition('/')[2]
                  if rel.startswith(('server/','hermes-plugin/p14/')) or rel in ('server','hermes-plugin','hermes-plugin/p14','scripts/check_p14r3_recovery.py','requirements/P14R3_RECOVERY_MATRIX.json','PROJECT.md','HANDOFF.md','AGENTS.md'):
                      m.name=rel;selected.append(m)
              t.extractall(target,members=selected,filter='data')
          print('Exact private source archive verified; no source or credential is published.')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate frozen canonical scope
        working-directory: ${{ runner.temp }}/p14-private-source
        run: python3 scripts/check_p14r3_recovery.py
      - name: Run full SQLite and PostgreSQL regression
        working-directory: ${{ runner.temp }}/p14-private-source
        run: |
          mkdir -p /tmp/p14-delivery
          python -m pip install -e './server[test]'
          pytest server/tests --tb=no --junitxml=/tmp/p14-delivery/server-tests.xml
      - name: Build exact Server image and verify process boundary
        working-directory: ${{ runner.temp }}/p14-private-source
        run: |
          docker build --label org.opencontainers.image.revision="$SOURCE_SHA" --label org.opencontainers.image.source=https://github.com/tevriqorg/P14-Entry -t "p14-server:$SOURCE_SHA" server
          python3 - <<'PY'
          from sqlalchemy import create_engine,text
          e=create_engine('postgresql+psycopg://p14:synthetic-ci-only@127.0.0.1:5432/p14_test',isolation_level='AUTOCOMMIT')
          with e.connect() as c:c.execute(text('CREATE DATABASE p14_smoke'))
          PY
          docker run -d --name p14-server-ci-smoke --network host -e P14_DATABASE_URL=postgresql+psycopg://p14:synthetic-ci-only@127.0.0.1:5432/p14_smoke -e P14_SERVER_TOKEN=synthetic-smoke-only -e P14_MEDIA_ROOT=/tmp/p14-media "p14-server:$SOURCE_SHA" uvicorn p14_server.main:app --host 127.0.0.1 --port 18014
          python3 - <<'PY'
          import httpx,time,json
          base='http://127.0.0.1:18014';headers={'Authorization':'Bearer synthetic-smoke-only'}
          for n in range(30):
              try:
                  if httpx.get(base+'/healthz').status_code==200:break
              except httpx.HTTPError:pass
              time.sleep(1)
          else:raise SystemExit('Image health failed')
          cmd={'client_operation_id':'quiet-op','entry_id':'quiet-entry','conversation_id':'quiet-conv','message_id':'quiet-message','text':'synthetic source'}
          assert httpx.post(base+'/v1/entries/capture',json=cmd).status_code==401
          a=httpx.post(base+'/v1/entries/capture',headers=headers,json=cmd);assert a.status_code==201
          b=httpx.post(base+'/v1/entries/capture',headers=headers,json=cmd);assert b.json()['deduplicated'] is True
          assert httpx.get(base+'/v1/hermes/inbound/next',headers=headers).json()['event'] is None
          m=httpx.post(base+'/v1/conversations/quiet-conv/messages',headers=headers,json={'client_operation_id':'discuss-op','message_id':'discuss-message','text':'explicit discussion'});assert m.status_code==201
          event=httpx.get(base+'/v1/hermes/inbound/next',headers=headers).json()['event']
          assert event['conversation_id']=='quiet-conv' and 'synthetic source' in event['text'] and 'explicit discussion' in event['text']
          open('/tmp/p14-delivery/image-smoke.json','w').write(json.dumps({'result':'PASS','checks':['health','auth','quiet capture','idempotency','no implicit AI','same conversation/source context'],'hermes_invoked':False})+'\n')
          print('Exact-image process boundary checks passed; no Hermes invoked.')
          PY
          docker rm -f p14-server-ci-smoke
          docker save "p14-server:$SOURCE_SHA" | gzip -1 > /tmp/p14-delivery/p14-server-image.tar.gz
          docker image inspect "p14-server:$SOURCE_SHA" --format '{{json .Id}}' > /tmp/p14-delivery/image-id.json
      - name: Encrypt private runtime artifact and publish non-secret provenance
        env:
          BUNDLE_KEY: ${{ secrets.P14_SERVER_ARTIFACT_BUNDLE_KEY }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,tarfile,xml.etree.ElementTree as E
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=pathlib.Path('/tmp/p14-delivery');out=pathlib.Path(os.environ['RUNNER_TEMP'])/'p14-encrypted-delivery';out.mkdir()
          xml=E.parse(root/'server-tests.xml').getroot();suites=xml.findall('testsuite') if xml.tag=='testsuites' else [xml]
          counts={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert counts['tests']>0 and not any(counts[k] for k in ('failures','errors','skipped'))
          prov={'source_repository':'tevriqorg/P14-Entry','source_sha':os.environ['SOURCE_SHA'],'source_archive_sha256':os.environ['ARCHIVE_SHA256'],'build_repository':os.environ['GITHUB_REPOSITORY'],'build_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'image_id':json.loads((root/'image-id.json').read_text()),'tests':counts,'image_process_smoke':'PASS','hermes_invoked':False,'artifact_encrypted':True}
          (root/'provenance.json').write_text(json.dumps(prov,indent=2)+'\n')
          plain=root/'bundle.tar'
          with tarfile.open(plain,'w') as t:
              for name in ('p14-server-image.tar.gz','image-id.json','server-tests.xml','image-smoke.json','provenance.json'):t.add(root/name,arcname=name)
          key=base64.b64decode(os.environ['BUNDLE_KEY']);assert len(key)==32;nonce=os.urandom(12)
          enc=out/'p14-server-bundle.aesgcm';enc.write_bytes(b'P14CI1\n'+nonce+AESGCM(key).encrypt(nonce,plain.read_bytes(),('tevriqorg/P14-Entry@'+os.environ['SOURCE_SHA']).encode()))
          (out/'provenance-public.json').write_text(json.dumps(prov,indent=2)+'\n')
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir())))
          print(json.dumps({'source_sha':prov['source_sha'],'tests':counts,'image_process_smoke':'PASS','artifact_encrypted':True}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p14-server-encrypted-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/p14-encrypted-delivery/
          retention-days: 7
          if-no-files-found: error
      - name: Remove private source and plaintext artifacts
        if: always()
        run: |
          docker rm -f p14-server-ci-smoke 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/p14-private-source" "$RUNNER_TEMP/p14-private-source.tar.gz" /tmp/p14-delivery
