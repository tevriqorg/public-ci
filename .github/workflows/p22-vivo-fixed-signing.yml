name: P22 vivo Android unsigned CI for Tokyo fixed-signing and P20

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-char commit in private tevriqorg/P22-Personal-Relay
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: p22-vivo-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build-unsigned:
    if: github.repository == 'tevriqorg/public-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Verify trusted P22 main HEAD and limited read-only credential
        env:
          GH_TOKEN: ${{ secrets.P22_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected an exact immutable SHA."; exit 1; }
          test -n "$GH_TOKEN" || { echo "::error::Missing P22_SOURCE_READ_TOKEN with Contents:read on P22 only."; exit 1; }
          # Do not let manually supplied historical or unreviewed commits run with a private source read token.
          actual_main="$(gh api repos/tevriqorg/P22-Personal-Relay/git/ref/heads/main --jq .object.sha)"
          test "$actual_main" = "$SOURCE_SHA" || { echo "::error::Requested source must exactly match reviewed P22 main HEAD."; exit 1; }
      - name: Checkout immutable private P22 source (not public-ci)
        uses: actions/checkout@v4
        with:
          repository: tevriqorg/P22-Personal-Relay
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.P22_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 33
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk --install 'platforms;android-33' 'build-tools;33.0.2'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and UNSIGNED release build
        working-directory: android-forwarder
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify unsigned candidate identity and provenance
        run: |
          set -euo pipefail
          APK=android-forwarder/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=/usr/local/lib/android/sdk/build-tools/33.0.2/aapt
          mkdir -p "$RUNNER_TEMP/p22-unsigned"
          python3 - "$APK" "$SOURCE_SHA" "$AAPT" "$RUNNER_TEMP/p22-unsigned" <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys
          apk, sha, aapt, folder = sys.argv[1:]
          output = subprocess.run([aapt, "dump", "badging", apk], check=True, capture_output=True, text=True).stdout
          m = re.search(r"^package: name='([^']+)' versionCode='(\d+)'", output, re.MULTILINE)
          assert m is not None, "No Android package identity"
          assert m.group(1) == "tech.bogomolov.incomingsmsgateway", "Package differs from installed vivo app"
          assert int(m.group(2)) >= 18, "Candidate must be newer than installed vivo baseline"
          assert "application-debuggable" not in output, "Release must not be debuggable"
          dest = pathlib.Path(folder)
          (dest / "SOURCE_SHA").write_text(sha + "\n")
          (dest / "candidate.json").write_text(json.dumps({
              "source_repository": "tevriqorg/P22-Personal-Relay",
              "source_sha": sha, "package": m.group(1),
              "version_code": int(m.group(2)), "status": "UNSIGNED_ONLY",
              "not_installable": True
          }, indent=2) + "\n")
          (dest / "UNSIGNED_SHA256").write_text(hashlib.sha256(pathlib.Path(apk).read_bytes()).hexdigest() + "\n")
          print("P22 unsigned package/provenance gate PASS; versionCode=" + m.group(2))
          PY
          cp "$APK" "$RUNNER_TEMP/p22-unsigned/app-release-unsigned.apk"
      - name: Upload UNSIGNED intermediate for Tokyo fixed-signing, not for end users
        uses: actions/upload-artifact@v4
        with:
          name: p22-vivo-UNSIGNED-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/p22-unsigned/
          if-no-files-found: error
          retention-days: 7

